[project]
name = "equipo5wm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paulo Araya", email = "pauloaraya42@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.163.1",
    "pydantic-settings>=2.16.3",
    "pymysql>=1.2.4",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
equipo5wm = "equipo5wm:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
